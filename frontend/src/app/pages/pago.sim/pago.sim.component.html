
<h2>Ingresar información</h2>
<form (submit)="onCheckout()">
  <div *ngFor="let item of cartItems">
    <!-- <p>{{ item.nombre_producto }} - {{ item.quantity }} x {{ item.precio }} = {{ item.quantity * item.precio }}</p> -->
  </div>
  <!-- <p>Total: {{ total }}</p> -->

  <label for="cardNumber">Número de Tarjeta</label>
  <input type="text" id="cardNumber" required>

  <label for="expiryDate">Fecha de Expiración</label>
  <input type="text" id="expiryDate" required>

  <label for="cvv">CVV</label>
  <input type="text" id="cvv" required>

<p>Verifique por favor!</p>
<h2>Usted debe abonar:</h2>
<div *ngFor="let item of cartItems">
  <p>{{ item.nombre_producto }} - {{ item.quantity }} x {{ item.precio }} = {{ item.quantity * item.precio }}</p>
</div>
<h3>Total: {{ total }}</h3>
<button (click)="onCheckout()">Pagar</button>
</form>
