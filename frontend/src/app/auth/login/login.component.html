<main>
  <div class="contenedor">
    <div class="caja" id="form">
      <form [formGroup]="loginForm" (ngSubmit)="login()" class="contenedor-ingreso" id="ingreso"> 
        <p class="text-danger">{{ loginError }}</p>
        <div class="caja-titulo">
          <h3>Bienvenido</h3>
        </div>
        <div class="grupo-inputs">
          <div class="campo-input">
            <input type="text" formControlName="email" class="caja-input" id="logEmail" required>
            <label for="logEmail">E-mail</label>
            <div *ngIf="email?.invalid && (email?.dirty || email?.touched)" class="text-danger">
              <div *ngIf="email?.errors?.['required']">
                El email es obligatorio.
              </div>
              <div *ngIf="email?.errors?.['email']">
                El email debe tener formato válido.
              </div>
            </div>
          </div>
          <div class="campo-input">
            <div class="input-group">
              <input [type]="passwordFieldType" formControlName="password" class="caja-input" id="contrasenaIngreso" required>
              <label for="contrasenaIngreso">Contraseña</label>
              <div class="input-group-append">
                <span class="input-group-text" (click)="togglePasswordVisibility()">
                  <!-- LÍNEA DEL ÍCONO DE OJO -->
                  <i class="fa-solid fa-eye"></i>
                </span>
              </div>
            </div>
            <div *ngIf="password?.invalid && (password?.dirty || password?.touched)" class="text-danger">
              <div *ngIf="password?.errors?.['required']">
                La contraseña es requerida.
              </div>
            </div>
          </div>
          <div class="campo-input">
            <input type="submit" class="input-submit" value="Ingresar" id="submitButton">
          </div>
          <a class="enlace" routerLink="/registro">¿No tenés cuenta aún? <b>Crear cuenta</b></a>
        </div>
      </form>
    </div>
  </div>
</main>

<!-- Mensaje flotante -->
<div *ngIf="showWelcomeMessage" class="welcome-message">
  {{ welcomeMessage }}
</div>
